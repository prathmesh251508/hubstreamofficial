<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer-when-downgrade" />
  <title>HubStream Cinema</title>
  
  <!-- HLS.js for .m3u8 streaming support -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <!-- 🛡️ Global Window Open & Redirect Blocker Script -->
  <script>
    window.open = function(url) {
        return null;
    };
    const originalLocation = window.location.href;
    setInterval(() => {
        if (window.location.href !== originalLocation && !window.location.href.includes("#")) {
            window.location.href = originalLocation;
        }
    }, 500);
  </script>

  <style>
    :root {
      --bg-color: #050508;
      --card-bg: rgba(18, 18, 26, 0.75);
      --accent-color: #e11d48;
      --tv-focus-color: #38bdf8;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Universal Responsive Header */
    header {
      background: rgba(10, 10, 15, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      text-decoration: none;
    }

    .brand-name {
      font-size: clamp(20px, 4vw, 26px);
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(225, 29, 72, 0.5);
    }

    .brand-name span {
      color: #38bdf8;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-input {
      background: rgba(20, 20, 30, 0.85);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      padding: 10px 16px;
      border-radius: 30px;
      color: white;
      font-size: 14px;
      width: clamp(160px, 30vw, 280px);
      outline: none;
      transition: all 0.3s ease;
    }

    .search-input:focus {
      border-color: var(--tv-focus-color);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
    }

    .btn-add {
      background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: transform 0.2s ease;
      white-space: nowrap;
    }

    button:focus, input:focus, .card:focus {
      outline: 3px solid var(--tv-focus-color) !important;
      outline-offset: 3px;
    }

    .btn-add:focus, .server-pill:focus, .close-btn:focus, .btn-submit:focus {
      transform: scale(1.05);
    }

    .catalog-wrapper {
      max-width: 1500px;
      margin: 0 auto;
      padding: 24px clamp(16px, 3vw, 35px);
      width: 100%;
      flex: 1;
    }

    .homepage-banner-box {
      width: 100%;
      min-height: 90px;
      margin-bottom: 24px;
      background: rgba(18, 18, 26, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .section-title {
      font-size: clamp(15px, 2.5vw, 19px);
      font-weight: 800;
      margin-bottom: 18px;
      color: #e2e8f0;
    }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: clamp(14px, 2vw, 22px);
    }

    @media (min-width: 640px) {
      .media-grid {
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      }
    }

    @media (min-width: 1024px) {
      .media-grid {
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      }
    }

    .card {
      background: var(--card-bg);
      border-radius: 14px;
      overflow: hidden;
      border: 1.5px solid rgba(255, 255, 255, 0.06);
      cursor: pointer;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      position: relative;
    }

    .card:hover, .card:focus {
      transform: translateY(-8px) scale(1.03);
      border-color: var(--tv-focus-color);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
      z-index: 10;
    }

    .poster-box {
      width: 100%;
      aspect-ratio: 2/3;
      background: #12121a;
      position: relative;
      overflow: hidden;
    }

    .poster-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .card:hover .poster-box img, .card:focus .poster-box img {
      transform: scale(1.05);
    }

    .play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .card:hover .play-overlay, .card:focus .play-overlay {
      opacity: 1;
    }

    .play-btn-circle {
      width: 48px;
      height: 48px;
      background: var(--accent-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 0 0 20px rgba(225, 29, 72, 0.8);
    }

    .card-footer {
      padding: 12px 14px;
      background: linear-gradient(to top, rgba(10, 10, 15, 0.95), rgba(18, 18, 26, 0.5));
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .card-tag {
      font-size: 12px;
      color: var(--text-muted);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 5, 10, 0.96);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(10px, 2vw, 24px);
      z-index: 2000;
      gap: 15px;
    }

    .side-ad-box {
      width: 140px;
      height: 550px;
      background: rgba(18, 18, 26, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    @media (max-width: 1150px) {
      .side-ad-box {
        display: none !important;
      }
    }

    .cinema-box {
      background: #0b1120;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      width: 100%;
      max-width: 1000px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9);
    }

    .cinema-topbar {
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
      background: #0f172a;
    }

    .close-btn {
      background: #1e293b;
      border: 1.5px solid #334155;
      color: #cbd5e1;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .screen-stage {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
      overflow: hidden;
    }

    .screen-stage iframe,
    .screen-stage video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .cinema-footer {
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0b1120;
      border-top: 1px solid #1e293b;
      flex-wrap: wrap;
      gap: 10px;
    }

    .server-switcher {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #94a3b8;
    }

    .server-pill {
      background: #1e293b;
      color: #cbd5e1;
      border: 1.5px solid #334155;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .server-pill.active {
      background: var(--accent-color);
      border-color: var(--accent-color);
      color: white;
    }

    .form-box {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 24px;
      width: 100%;
      max-width: 460px;
    }

    label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #9ca3af;
      display: block;
      margin: 12px 0 6px;
    }

    input[type="text"], input[type="url"] {
      width: 100%;
      background: #1e293b;
      border: 1.5px solid #334155;
      padding: 10px 14px;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      outline: none;
    }

    .btn-submit {
      width: 100%;
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 18px;
    }

    .watermark-cover {
      position: absolute;
      top: 12px;
      right: 16px;
      width: 40px;
      height: 32px;
      background: rgba(11, 17, 32, 0.9);
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      color: var(--accent-color);
      font-weight: 900;
      font-size: 13px;
      pointer-events: none;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Top Navbar with Clean RGB Glowing Logo -->
  <header>
    <a href="/" class="brand-logo">
      <svg width="36" height="36" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0 0 8px rgba(0, 255, 255, 0.6));">
        <defs>
          <linearGradient id="rgbGlow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff0055"/>
            <stop offset="33%" stop-color="#00ff66"/>
            <stop offset="66%" stop-color="#00ffff"/>
            <stop offset="100%" stop-color="#cc00ff"/>
          </linearGradient>
        </defs>
        <circle cx="16" cy="16" r="15" stroke="url(#rgbGlow)" stroke-width="2.5" fill="#0b1120"/>
        <circle cx="16" cy="16" r="5" fill="url(#rgbGlow)"/>
        <rect x="14" y="5" width="4" height="6" rx="2" fill="url(#rgbGlow)"/>
        <rect x="14" y="21" width="4" height="6" rx="2" fill="url(#rgbGlow)"/>
      </svg>
      <div class="brand-name">Hub<span>Stream</span></div>
    </a>
    <div class="header-controls">
      <input type="text" id="searchInput" class="search-input" placeholder="Search title..." oninput="handleSearch()">
      <button class="btn-add" onclick="openAddForm()">+ Add</button>
    </div>
  </header>

  <!-- Catalog View -->
  <main class="catalog-wrapper">
    <div class="homepage-banner-box" id="homeAdBox"></div>

    <div class="section-title">Live Streams & Movies</div>
    <div class="media-grid" id="gridArea"></div>
  </main>

  <!-- EMBEDDED THEATER PLAYER -->
  <div id="playerModal" class="modal-overlay hidden">
    <div class="side-ad-box" id="leftAdBox"></div>

    <div class="cinema-box">
      <div class="cinema-topbar">
        <div>
          <strong id="mTitle" style="font-size: 14px;">Playing Video</strong>
          <span style="font-size: 11px; color: #10b981; margin-left: 8px;" id="adShieldStatus">● Ad-Shield Active</span>
        </div>
        <button class="close-btn" id="closePlayerBtn" onclick="closePlayer()">✕</button>
      </div>

      <div class="screen-stage">
        <div id="clickShield" style="position: absolute; inset: 0; z-index: 30; background: transparent; cursor: pointer;" onclick="
          this.style.pointerEvents = 'none';
          setTimeout(() => { this.style.display = 'none'; }, 500);
        "></div>

        <iframe id="embedPlayer" src="" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="no-referrer"></iframe>
        <video id="nativePlayer" controls class="hidden"></video>
        <div id="hsWatermark" class="watermark-cover hidden">HS</div>
      </div>

      <div class="cinema-footer">
        <div class="server-switcher">
          <span>Mirror:</span>
          <button class="server-pill active" onclick="switchServer(1)">Main</button>
          <button class="server-pill" onclick="switchServer(2)">Backup</button>
        </div>
        <div style="font-size: 11px; color: #64748b;" id="modeText">Zero Redirect Mode</div>
      </div>
    </div>

    <div class="side-ad-box" id="rightAdBox"></div>
  </div>

  <!-- ADD STREAM FORM MODAL -->
  <div id="addModal" class="modal-overlay hidden">
    <div class="form-box">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <strong style="font-size: 16px;">Add New Stream Link</strong>
        <button class="close-btn" onclick="closeAddForm()">✕</button>
      </div>

      <label>Movie Title</label>
      <input type="text" id="inTitle" placeholder="e.g. Action Blockbuster">

      <label>Poster Image URL</label>
      <input type="url" id="inPoster" placeholder="https://image-url.com/poster.jpg">

      <label>TMDB Movie ID</label>
      <input type="text" id="inTmdbId" placeholder="e.g. 1709391">

      <label>Stream / Embed URL</label>
      <input type="url" id="inStreamUrl" placeholder="https://server-embed.com/e/xyz">

      <button class="btn-submit" onclick="saveStreamItem()">Embed to Player</button>
    </div>
  </div>

  <script>
    const API_BASE = "https://hubstreamofficial.onrender.com/api";
    let searchDebounce = null;
    let activeItem = null;
    let currentServerNum = 1;

    async function fetchMovies(query = "") {
      const grid = document.getElementById("gridArea");
      const url = query ? `${API_BASE}/search?q=${encodeURIComponent(query)}` : `${API_BASE}/movies`;

      try {
        const res = await fetch(url);
        let movies = await res.json();
        renderCatalog(movies);
      } catch (err) {
        grid.innerHTML = `<div style="grid-column: 1/-1; color: #ef4444; padding: 20px; text-align: center;">⚠️ Backend connection error.</div>`;
      }
    }

    function renderCatalog(items) {
      const grid = document.getElementById("gridArea");
      grid.innerHTML = "";

      const filteredItems = (items || []).filter(item => item.title !== "H.S");

      if (filteredItems.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; color: #64748b; text-align: center; padding: 20px;">No movies found.</div>';
        return;
      }

      filteredItems.forEach((item) => {
        const card = document.createElement("div");
        card.className = "card";
        card.setAttribute("tabindex", "0");
        card.onclick = () => openTheater(item);

        card.onkeydown = (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openTheater(item);
          }
        };

        card.innerHTML = `
          <div class="poster-box">
            <div class="play-overlay"><div class="play-btn-circle">▶</div></div>
            <img src="${item.poster || 'https://images.unsplash.com/photo-1485846234645-a62644f84728?w=400&q=80'}" alt="${item.title}" loading="lazy">
          </div>
          <div class="card-footer">
            <div class="card-title">${item.title}</div>
            <div class="card-tag">${item.year ? item.year + ' • ' : ''}★ ${item.rating || 'N/A'}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function handleSearch() {
      clearTimeout(searchDebounce);
      const query = document.getElementById("searchInput").value.trim();
      searchDebounce = setTimeout(() => fetchMovies(query), 250);
    }

    function openTheater(item) {
      activeItem = item;
      document.getElementById("mTitle").innerText = item.title;

      const iframe = document.getElementById("embedPlayer");
      const video = document.getElementById("nativePlayer");
      const shield = document.getElementById("clickShield");
      
      shield.style.display = "block";
      shield.style.pointerEvents = "auto";
      video.pause();
      iframe.src = "about:blank";

      const streamSource = item.streamUrl || "";

      if (streamSource.includes(".m3u8") || streamSource.endsWith(".mp4")) {
        iframe.classList.add("hidden");
        video.classList.remove("hidden");
        const proxyStreamUrl = `${API_BASE}/stream/proxy?url=${encodeURIComponent(streamSource)}`;

        if (streamSource.includes(".m3u8") && Hls.isSupported()) {
          if (window.hlsInstance) window.hlsInstance.destroy();
          window.hlsInstance = new Hls();
          window.hlsInstance.loadSource(proxyStreamUrl);
          window.hlsInstance.attachMedia(video);
          window.hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else {
          video.src = proxyStreamUrl;
          video.play();
        }
      } else {
        video.classList.add("hidden");
        iframe.classList.remove("hidden");
        document.getElementById("hsWatermark").classList.remove("hidden");

        if (streamSource) {
           iframe.src = streamSource;
        } else if (item.id) {
           // Using VidSrc ID-based routing
           if (currentServerNum === 2) {
              iframe.src = `https://vidsrc.vip/embed/movie/${item.id}`;
           } else {
              iframe.src = `https://vidsrc.cc/v2/embed/movie/${item.id}`;
           }
        }
      }

      document.getElementById("playerModal").classList.remove("hidden");
      setTimeout(() => {
        document.getElementById("closePlayerBtn").focus();
      }, 200);
    }

    function closePlayer() {
      const iframe = document.getElementById("embedPlayer");
      const video = document.getElementById("nativePlayer");
      video.pause();
      video.src = "";
      video.classList.add("hidden");
      if (window.hlsInstance) { window.hlsInstance.destroy(); window.hlsInstance = null; }
      iframe.src = "about:blank";
      iframe.classList.add("hidden");
      document.getElementById("hsWatermark").classList.add("hidden");
      document.getElementById("playerModal").classList.add("hidden");
    }

    function switchServer(num) {
      currentServerNum = num;
      document.querySelectorAll(".server-pill").forEach(p => p.classList.remove("active"));
      event.target.classList.add("active");
      if (activeItem) openTheater(activeItem);
    }

    function openAddForm() { document.getElementById("addModal").classList.remove("hidden"); }
    function closeAddForm() { document.getElementById("addModal").classList.add("hidden"); }

    function saveStreamItem() {
      const title = document.getElementById("inTitle")?.value.trim() || "";
      const poster = document.getElementById("inPoster")?.value.trim() || "";
      const tmdbId = document.getElementById("inTmdbId")?.value.trim() || "";
      const streamUrl = document.getElementById("inStreamUrl")?.value.trim() || "";

      if (!title) { alert("Please provide a Title!"); return; }

      const grid = document.getElementById("gridArea");
      const card = document.createElement("div");
      card.className = "card";
      card.setAttribute("tabindex", "0");
      const manualItem = { id: tmdbId, title: title, poster: poster, streamUrl: streamUrl };
      card.onclick = () => openTheater(manualItem);

      card.innerHTML = `
        <div class="poster-box">
          <div class="play-overlay"><div class="play-btn-circle">▶</div></div>
          <img src="${poster || 'https://images.unsplash.com/photo-1485846234645-a62644f84728?w=400&q=80'}" alt="${title}">
        </div>
        <div class="card-footer">
          <div class="card-title">${title}</div>
          <div class="card-tag">Custom • 1080p</div>
        </div>
      `;
      grid.prepend(card);
      closeAddForm();
    }

    window.onload = () => {
      fetchMovies();
    };
  </script>
</body>
</html>
