<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HubStream Cinema - Pure Embedded Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #080c16;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation */
    header {
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    .brand-title span {
      color: #e11d48;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-input {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 8px 14px;
      border-radius: 8px;
      color: white;
      font-size: 13px;
      width: 220px;
      outline: none;
    }

    .search-input:focus {
      border-color: #e11d48;
    }

    .btn-add {
      background: #e11d48;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-add:hover {
      background: #be123c;
    }

    /* Cinema Grid Layout */
    .catalog-wrapper {
      max-width: 1300px;
      margin: 0 auto;
      padding: 24px;
      width: 100%;
      flex: 1;
    }

    .section-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #e2e8f0;
    }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 18px;
    }

    /* Poster Card */
    .card {
      background: #0f172a;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #1e293b;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      position: relative;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #e11d48;
    }

    .poster-box {
      width: 100%;
      height: 250px;
      background: #1e293b;
      position: relative;
    }

    .poster-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .card:hover .play-overlay {
      opacity: 1;
    }

    .play-btn-circle {
      width: 48px;
      height: 48px;
      background: #e11d48;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 20px rgba(225, 29, 72, 0.7);
    }

    .card-footer {
      padding: 10px 12px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 700;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-tag {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 4px;
    }

    /* Fullscreen Cinema Player Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 6, 12, 0.94);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 100;
    }

    .cinema-box {
      background: #0b1120;
      border: 1px solid #1e293b;
      border-radius: 16px;
      width: 100%;
      max-width: 900px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
    }

    .cinema-topbar {
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
      background: #0f172a;
    }

    .close-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    .close-btn:hover {
      background: #e11d48;
      color: white;
    }

    /* Embedded Video Frame Container */
    .screen-stage {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* Pure 16:9 Aspect Ratio */
      background: #000;
    }

    .screen-stage iframe,
    .screen-stage video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Server Controls & Actions */
    .cinema-footer {
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0b1120;
      border-top: 1px solid #1e293b;
      flex-wrap: wrap;
      gap: 10px;
    }

    .server-switcher {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #94a3b8;
    }

    .server-pill {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .server-pill.active {
      background: #e11d48;
      border-color: #e11d48;
      color: white;
    }

    /* Admin Add Form */
    .form-box {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 24px;
      width: 100%;
      max-width: 480px;
    }

    label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #94a3b8;
      display: block;
      margin: 12px 0 6px;
    }

    input {
      width: 100%;
      background: #1e293b;
      border: 1.5px solid #334155;
      padding: 10px 12px;
      border-radius: 8px;
      color: white;
      font-size: 13px;
      outline: none;
    }

    input:focus {
      border-color: #e11d48;
    }

    .btn-submit {
      width: 100%;
      background: #e11d48;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 18px;
    }

    /* Custom Watermark Overlay to Hide 3rd Party Logos */
    .watermark-cover {
      position: absolute;
      top: 15px;
      right: 20px;
      width: 45px;
      height: 35px;
      background: rgba(11, 17, 32, 0.9);
      backdrop-filter: blur(4px);
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      color: #e11d48;
      font-weight: 900;
      font-size: 14px;
      pointer-events: none;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    
    .hidden { display: none !important; }
    
    /* Loading Spinner Animation */
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <header>
    <div class="brand-title">Hub<span>Stream</span> Cinema</div>
    <div class="header-controls">
      <input type="text" id="searchInput" class="search-input" placeholder="Search title..." oninput="handleSearch()">
      <button class="btn-add" onclick="openAddForm()">+ Add Embed Link</button>
    </div>
  </header>

  <!-- Catalog View -->
  <main class="catalog-wrapper">
    <div class="section-title">Live Streams & Movies (Fully Embedded)</div>
    <div class="media-grid" id="gridArea"></div>
  </main>

  <!-- EMBEDDED THEATER PLAYER (With Ad-Shield Sandbox) -->
  <div id="playerModal" class="modal-overlay hidden">
    <div class="cinema-box">
      <div class="cinema-topbar">
        <div>
          <strong id="mTitle" style="font-size: 14px;">Playing Video</strong>
          <span style="font-size: 11px; color: #10b981; margin-left: 8px;">● Ad-Shield Active</span>
        </div>
        <button class="close-btn" onclick="closePlayer()">✕</button>
      </div>

      <!-- Stage with Safe Sandbox -->
      <div class="screen-stage">
        
        <!-- HubStream 10-Sec Ad/Intro Overlay (Premium Layout) -->
        <div id="adOverlay" class="hidden" style="position: absolute; inset: 0; background: rgba(11, 17, 32, 0.96); backdrop-filter: blur(8px); z-index: 50; display: flex; flex-direction: column; justify-content: center; align-items: center;">
          
          <div style="font-size: 20px; font-weight: 900; letter-spacing: 1px; margin-bottom: 20px;">Hub<span style="color: #e11d48;">Stream</span></div>

          <!-- Ad Network Banner Space (Standard 300x250 Box) -->
          <div style="width: 300px; height: 250px; background: #1e293b; border: 1px dashed #334155; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
            <span style="font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px;">Advertisement</span>
            <span style="font-size: 13px; color: #cbd5e1;">Banner Ad (300x250)</span>
            <!-- Future: Adsterra ya Monetag ka <script> tag yahan aayega -->
          </div>

          <!-- Animated Loader & Timer -->
          <div style="display: flex; align-items: center; gap: 12px; padding: 10px 20px; background: rgba(225, 29, 72, 0.1); border: 1px solid rgba(225, 29, 72, 0.2); border-radius: 30px;">
            <div style="width: 18px; height: 18px; border: 3px solid #e11d48; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
            <div style="font-size: 13px; color: #e2e8f0; font-weight: 600;">
              Loading Stream... <span id="adTimer" style="color: #e11d48; font-weight: 800; font-size: 16px; margin-left: 4px;">10</span>s
            </div>
          </div>

        </div>

        <!-- iFrame for embed links (Sandbox stops annoying pop-up tabs) -->
        <iframe 
          id="embedPlayer" 
          src="" 
          allowfullscreen 
          allow="autoplay; encrypted-media; picture-in-picture"
          referrerpolicy="no-referrer">
        </iframe>

        <!-- Direct MP4 Player for raw video links -->
        <video id="nativePlayer" controls class="hidden"></video>
        
        <!-- Our Custom Watermark to hide the cloud icon -->
        <div id="hsWatermark" class="watermark-cover hidden">HS</div>
      </div>

      <div class="cinema-footer">
        <div class="server-switcher">
          <span>Stream Mirror:</span>
          <button class="server-pill active" onclick="switchServer(1)">Main Stream</button>
          <button class="server-pill" onclick="switchServer(2)">Backup Direct</button>
        </div>
        <div style="font-size: 11px; color: #64748b;">Zero Redirect Mode Enabled</div>
      </div>
    </div>
  </div>

  <!-- ADD STREAM FORM MODAL -->
  <div id="addModal" class="modal-overlay hidden">
    <div class="form-box">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <strong style="font-size: 16px;">Add New Stream Link</strong>
        <button class="close-btn" onclick="closeAddForm()">✕</button>
      </div>

      <label>Movie / Content Title</label>
      <input type="text" id="inTitle" placeholder="e.g. Action Blockbuster 2026">

      <label>Poster Image Link (URL)</label>
      <input type="url" id="inPoster" placeholder="https://image-url.com/poster.jpg">

      <label>TMDB Movie ID (For Automation)</label>
      <input type="text" id="inTmdbId" placeholder="e.g. 1709391">

      <label>Embedded Player Link / Embed URL (Leave blank for auto)</label>
      <input type="url" id="inStreamUrl" placeholder="https://server-embed.com/e/xyz or .mp4 link">

      <button class="btn-submit" onclick="saveStreamItem()">Embed to Player ➔</button>
    </div>
  </div>

  <script>
    const API_BASE = "http://127.0.0.1:5000/api";
    let searchDebounce = null;
    let activeItem = null;

    // Load initial movies from your SQLite database through server.py
    async function fetchMovies(query = "") {
      const grid = document.getElementById("gridArea");
      const url = query 
        ? `${API_BASE}/search?q=${encodeURIComponent(query)}` 
        : `${API_BASE}/movies`;

      try {
        const res = await fetch(url);
        let movies = await res.json();

        // Pin Hanu-Man at the very top of catalog
        if (!query) {
          movies.unshift({
            id: 1094556,
            title: "Hanu-Man (2024)",
            poster: "https://image.tmdb.org/t/p/w500/5m1Wv9z9nRj8Q7nQ5JtVf9jY8L2.jpg",
            streamUrl: "https://hubstream.art/hlsmod/p16-ad-site-sign-sg.tiktokcdn.com/kaABCikw_hgCw9RMhpDddQ/ipt/ipljen89/etbsnf/tt/master.m3u8?v=1766826492",
            year: "2024",
            rating: 8.2
          });
        }

        renderCatalog(movies);
      } catch (err) {
        grid.innerHTML = `
          <div style="grid-column: 1/-1; color: #ef4444; padding: 30px; text-align: center;">
            ⚠️ Local database server is not running. In your terminal run: <strong>python server.py</strong>
          </div>
        `;
      }
    }

    function renderCatalog(items) {
      const grid = document.getElementById("gridArea");
      grid.innerHTML = "";

      if (!items || items.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; color: #64748b; text-align: center; padding: 30px;">No movies found.</div>`;
        return;
      }

      items.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";
        
        // Setup playback item with default stream if not present
        const playableItem = {
          id: item.id,
          title: item.title,
          poster: item.poster,
          streamUrl: item.streamUrl || ""
        };
        card.onclick = () => openTheater(playableItem);

        card.innerHTML = `
          <div class="poster-box">
            <div class="play-overlay">
              <div class="play-btn-circle">▶</div>
            </div>
            <img src="${item.poster || 'https://images.unsplash.com/photo-1485846234645-a62644f84728?w=400&q=80'}" alt="${item.title}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1485846234645-a62644f84728?w=400&q=80'">
          </div>
          <div class="card-footer">
            <div class="card-title">${item.title}</div>
            <div class="card-tag">${item.year ? item.year + ' • ' : ''}★ ${item.rating || 'N/A'}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Live search connected to local SQLite database
    function handleSearch() {
      clearTimeout(searchDebounce);
      const query = document.getElementById("searchInput").value.trim();
      searchDebounce = setTimeout(() => {
        fetchMovies(query);
      }, 250);
    }

   let adInterval = null;

    // Smart Dual Player Handler
    function openTheater(item) {
      activeItem = item;
      document.getElementById("mTitle").innerText = item.title;

      const iframe = document.getElementById("embedPlayer");
      const video = document.getElementById("nativePlayer");
      const adOverlay = document.getElementById("adOverlay");
      const adTimerText = document.getElementById("adTimer");

      // Stop any existing playback and clear old timers
      video.pause();
      iframe.src = "about:blank";
      clearInterval(adInterval);
      adOverlay.classList.add("hidden");
      adOverlay.style.display = "none";

      const streamSource = item.streamUrl || "";

      // Check if source is a direct stream (.m3u8 or .mp4)
      if (streamSource.includes(".m3u8") || streamSource.endsWith(".mp4")) {
        iframe.classList.add("hidden");
        iframe.style.display = "none";
        
        video.classList.remove("hidden");
        video.style.display = "block";

        const proxyStreamUrl = `${API_BASE}/stream/proxy?url=${encodeURIComponent(streamSource)}`;

        if (streamSource.includes(".m3u8")) {
          if (Hls.isSupported()) {
            if (window.hlsInstance) { window.hlsInstance.destroy(); }
            window.hlsInstance = new Hls();
            window.hlsInstance.loadSource(proxyStreamUrl);
            window.hlsInstance.attachMedia(video);
            window.hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play());
          } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
            video.src = proxyStreamUrl;
            video.play();
          }
        } else {
          video.src = proxyStreamUrl;
          video.play();
        }
      } else {
        // Iframe Player for Vidstuck
        video.classList.add("hidden");
        video.style.display = "none";
        
        iframe.classList.remove("hidden");
        iframe.style.display = "block";
        
        // Watermark on karein
        document.getElementById("hsWatermark").classList.remove("hidden");

        if (streamSource) {
           iframe.src = streamSource;
        } else if (item.id) {
           iframe.src = `https://vidstuck.xyz/embed/movie/${item.id}?color=e50914&autoplay=false&back=false`;
           
           // SHOW 10 SECOND AD OVERLAY TO HIDE VIDSTUCK LOGO
           adOverlay.classList.remove("hidden");
           adOverlay.style.display = "flex";
           let timeLeft = 10;
           adTimerText.innerText = timeLeft;
           
           adInterval = setInterval(() => {
             timeLeft--;
             adTimerText.innerText = timeLeft;
             if (timeLeft <= 0) {
               clearInterval(adInterval);
               adOverlay.style.display = "none"; // Hide ad after 10 sec
             }
           }, 1000);

        } else {
           alert("⚠️ Automation Error: Is movie ka TMDB ID ya Stream Link available nahi hai!");
           closePlayer();
        }
      }

      document.getElementById("playerModal").classList.remove("hidden");
    }

    function closePlayer() {
      clearInterval(adInterval);
      document.getElementById("adOverlay").style.display = "none";
      
      const iframe = document.getElementById("embedPlayer");
      const video = document.getElementById("nativePlayer");
      
      // Native player pause aur clear karein
      video.pause();
      video.src = "";
      video.classList.add("hidden");
      video.style.display = "none";

      // HLS instance destroy karein
      if (window.hlsInstance) {
        window.hlsInstance.destroy();
        window.hlsInstance = null;
      }

      // Iframe ko completely reset aur hide karein
      iframe.src = "about:blank";
      iframe.classList.add("hidden");
      iframe.style.display = "none";
      
      // Watermark hide karein
      document.getElementById("hsWatermark").classList.add("hidden");

      document.getElementById("playerModal").classList.add("hidden");
    }

    function switchServer(num) {
      document.querySelectorAll(".server-pill").forEach(p => p.classList.remove("active"));
      event.target.classList.add("active");
      if (activeItem) {
        openTheater(activeItem);
      }
    }

    // Add Form Modals
    function openAddForm() {
      document.getElementById("addModal").classList.remove("hidden");
    }

    function closeAddForm() {
      document.getElementById("addModal").classList.add("hidden");
    }

    function saveStreamItem() {
      const title = document.getElementById("inTitle")?.value.trim() || "";
      const poster = document.getElementById("inPoster")?.value.trim() || "";
      const tmdbId = document.getElementById("inTmdbId")?.value.trim() || "";
      const streamUrl = document.getElementById("inStreamUrl")?.value.trim() || "";

      if (!title) {
        alert("Please provide a Title!");
        return;
      }
      if (!streamUrl && !tmdbId) {
        alert("Please provide either a TMDB ID (for automation) OR a Stream Link!");
        return;
      }

      // Add newly submitted embed to the top of the grid
      const grid = document.getElementById("gridArea");
      const card = document.createElement("div");
      card.className = "card";
      const manualItem = { id: tmdbId, title: title, poster: poster, streamUrl: streamUrl };
      card.onclick = () => openTheater(manualItem);

      card.innerHTML = `
        <div class="poster-box">
          <div class="play-overlay">
            <div class="play-btn-circle">▶</div>
          </div>
          <img src="${poster || 'https://images.unsplash.com/photo-1485846234645-a62644f84728?w=400&q=80'}" alt="${title}">
        </div>
        <div class="card-footer">
          <div class="card-title">${title}</div>
          <div class="card-tag">Custom Embed • 1080p</div>
        </div>
      `;
      grid.prepend(card);

      closeAddForm();
      document.getElementById("inTitle").value = "";
      document.getElementById("inPoster").value = "";
      document.getElementById("inTmdbId").value = "";
      document.getElementById("inStreamUrl").value = "";
    }

    window.onload = () => fetchMovies();
  </script>
</body>
</html>
