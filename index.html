<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer-when-downgrade" />
  <title>HubStream Cinema</title>
  
  <!-- HLS.js for .m3u8 streaming support -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <!-- 🛡️ Global Window Open & Redirect Blocker Script -->
  <script>
    window.open = function(url) {
        return null;
    };
    const originalLocation = window.location.href;
    setInterval(() => {
        if (window.location.href !== originalLocation && !window.location.href.includes("#")) {
            window.location.href = originalLocation;
        }
    }, 500);
  </script>

  <style>
    /* 🎨 Vibe 1: Minimal Indie (Default) */
    :root, body.vibe-indie {
      --bg: #07070a;
      --surface: #101015;
      --surface-hover: #181822;
      --border: #22222f;
      --accent: #f43f5e;
      --accent-glow: rgba(244, 63, 94, 0.25);
      --tv-focus: #38bdf8;
      --text: #ededed;
      --muted: #888896;
      --card-radius: 10px;
      --header-bg: rgba(7, 7, 10, 0.85);
    }

    /* 🌈 Vibe 2: Cyber Neon / AI Glow */
    body.vibe-neon {
      --bg: #03050a;
      --surface: #0b1120;
      --surface-hover: #1e293b;
      --border: #334155;
      --accent: #00ffcc;
      --accent-glow: rgba(0, 255, 204, 0.4);
      --tv-focus: #ff007f;
      --text: #ffffff;
      --muted: #94a3b8;
      --card-radius: 14px;
      --header-bg: rgba(3, 5, 10, 0.92);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    /* Navbar */
    header {
      background: var(--header-bg);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      transition: all 0.3s ease;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      text-decoration: none;
    }

    .brand-name {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .brand-name span {
      color: var(--accent);
      text-shadow: 0 0 10px var(--accent-glow);
    }

    /* Navigation Links */
    .nav-links {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .nav-link {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .nav-link:hover, .nav-link.active {
      color: var(--text);
      background: var(--surface-hover);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Vibe Toggle Button */
    .vibe-toggle-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .vibe-toggle-btn:hover {
      border-color: var(--accent);
      background: var(--surface-hover);
    }

    .search-input {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 9px 16px;
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      width: 220px;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
      background: var(--surface-hover);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .btn-add {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 9px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: opacity 0.2s ease;
      white-space: nowrap;
    }

    body.vibe-indie .btn-add { color: #fff; }
    .btn-add:hover { opacity: 0.9; }

    /* Focus States */
    button:focus, input:focus, .card:focus {
      outline: 2px solid var(--tv-focus) !important;
      outline-offset: 2px;
    }

    /* Layout */
    .catalog-wrapper {
      max-width: 1400px;
      margin: 0 auto;
      padding: 30px 24px;
      width: 100%;
      flex: 1;
    }

    .homepage-banner-box {
      width: 100%;
      min-height: 80px;
      margin-bottom: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .section-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Grid */
    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 20px;
    }

    @media (min-width: 1024px) {
      .media-grid {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      }
    }

    /* Card */
    .card {
      background: var(--surface);
      border-radius: var(--card-radius);
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      position: relative;
    }

    .card:hover, .card:focus {
      transform: translateY(-5px);
      border-color: var(--accent);
      box-shadow: 0 12px 30px var(--accent-glow);
      z-index: 10;
    }

    .poster-box {
      width: 100%;
      aspect-ratio: 2/3;
      background: #000;
      position: relative;
      overflow: hidden;
    }

    .poster-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .card:hover .poster-box img, .card:focus .poster-box img {
      transform: scale(1.04);
    }

    .play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .card:hover .play-overlay, .card:focus .play-overlay {
      opacity: 1;
    }

    .play-btn-circle {
      width: 44px;
      height: 44px;
      background: var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      color: #000;
      font-weight: bold;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .card-footer {
      padding: 12px;
      background: var(--surface);
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .card-tag {
      font-size: 11px;
      color: var(--muted);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 5, 10, 0.92);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 2000;
      gap: 16px;
    }

    .side-ad-box {
      width: 140px;
      height: 550px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    @media (max-width: 1100px) {
      .side-ad-box { display: none !important; }
    }

    .cinema-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: 100%;
      max-width: 950px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
    }

    .cinema-topbar {
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .close-btn {
      background: var(--border);
      border: none;
      color: var(--text);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      transition: background 0.2s;
    }

    .close-btn:hover {
      background: var(--accent);
      color: #000;
    }

    .screen-stage {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
      overflow: hidden;
    }

    .screen-stage iframe,
    .screen-stage video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .cinema-footer {
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 10px;
    }

    .server-switcher {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .server-pill {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .server-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
    }

    .form-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      width: 100%;
      max-width: 440px;
    }

    label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--muted);
      display: block;
      margin: 12px 0 6px;
      letter-spacing: 0.5px;
    }

    input[type="text"], input[type="url"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }

    input[type="text"]:focus, input[type="url"]:focus {
      border-color: var(--accent);
    }

    .btn-submit {
      width: 100%;
      background: var(--accent);
      color: #000;
      border: none;
      padding: 11px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 18px;
    }

    .watermark-cover {
      position: absolute;
      top: 12px;
      right: 16px;
      width: 38px;
      height: 30px;
      background: rgba(0,0,0,0.8);
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      color: var(--accent);
      font-weight: 800;
      font-size: 12px;
      pointer-events: none;
    }

    .hidden { display: none !important; }
  </style>
</head>

  <script>
    const API_BASE = "https://hubstreamofficial.onrender.com/api";
    let searchDebounce = null;
    let activeItem = null;
    let cachedMovies = [];
    let currentCategory = 'all';

    // 🎨 Vibe Switcher Logic
    function toggleVibe() {
      const body = document.body;
      const btn = document.getElementById("vibeBtn");
      if (body.classList.contains("vibe-indie")) {
        body.classList.remove("vibe-indie");
        body.classList.add("vibe-neon");
        btn.innerHTML = "🌈 Vibe: Neon";
        localStorage.setItem("hubstream_vibe", "neon");
      } else {
        body.classList.remove("vibe-neon");
        body.classList.add("vibe-indie");
        btn.innerHTML = "⚡ Vibe: Indie";
        localStorage.setItem("hubstream_vibe", "indie");
      }
    }

    function loadSavedVibe() {
      const saved = localStorage.getItem("hubstream_vibe");
      const body = document.body;
      const btn = document.getElementById("vibeBtn");
      if (saved === "neon") {
        body.classList.remove("vibe-indie");
        body.classList.add("vibe-neon");
        if(btn) btn.innerHTML = "🌈 Vibe: Neon";
      } else {
        body.classList.add("vibe-indie");
        if(btn) btn.innerHTML = "⚡ Vibe: Indie";
      }
    }

    // 🔀 Category Switcher (Movies vs Anime)
    function switchCategory(category) {
      currentCategory = category;
      document.getElementById("navAll").classList.remove("active");
      document.getElementById("navAnime").classList.remove("active");

      const titleEl = document.getElementById("sectionTitle");

      if (category === 'anime') {
        document.getElementById("navAnime").classList.add("active");
        if(titleEl) titleEl.innerText = "Anime Collection";
      } else {
        document.getElementById("navAll").classList.add("active");
        if(titleEl) titleEl.innerText = "Trending Catalog";
      }

      fetchMovies();
    }

    function checkProAccess() {
      const urlParams = new URLSearchParams(window.location.search);
      const isProParam = urlParams.get('pro') === 'true' || urlParams.get('vip') === 'true';
      const now = new Date().getTime();

      if (isProParam) {
        localStorage.setItem('hubstream_pro_expiry', now + (24 * 60 * 60 * 1000));
      }

      const storedExpiry = localStorage.getItem('hubstream_pro_expiry');
      if (storedExpiry && now < parseInt(storedExpiry)) {
        document.querySelectorAll('.homepage-banner-box, .side-ad-box').forEach(box => box.remove());
        const statusEl = document.getElementById('adShieldStatus');
        if(statusEl) {
          statusEl.innerText = '● VIP Active';
          statusEl.style.color = '#38bdf8';
        }
      }
    }

    async function fetchMovies(query = "") {
      const grid = document.getElementById("gridArea");
      let endpoint = `${API_BASE}/movies`;
      
      if (query) {
        endpoint = `${API_BASE}/search?q=${encodeURIComponent(query)}`;
      } else if (currentCategory === 'anime') {
        endpoint = `${API_BASE}/movies?category=anime`;
      }

      try {
        const res = await fetch(endpoint);
        cachedMovies = await res.json();
        
        // Client-side fallback filter for anime titles
        let displayList = cachedMovies;
        if (currentCategory === 'anime') {
          displayList = cachedMovies.filter(m => {
            const t = m.title.toLowerCase();
            return t.includes('anime') || t.includes('naruto') || t.includes('one piece') || t.includes('dragon ball') || t.includes('attack on titan') || t.includes('demon slayer') || t.includes('jujutsu kaisen') || t.includes('pokemon');
          });
        }

        renderCatalog(displayList);
        checkUrlParamsAndPlay();
      } catch (err) {
        grid.innerHTML = `<div style="grid-column: 1/-1; color: #ef4444; padding: 20px; text-align: center;">⚠️ Backend connection error.</div>`;
      }
    }

    function renderCatalog(items) {
      const grid = document.getElementById("gridArea");
      grid.innerHTML = "";

      const filteredItems = (items || []).filter(item => item.title !== "H.S");

      if (filteredItems.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; color: var(--muted); text-align: center; padding: 20px;">No content found in this category.</div>';
        return;
      }

      filteredItems.forEach((item) => {
        const card = document.createElement("div");
        card.className = "card";
        card.setAttribute("tabindex", "0");
        card.onclick = () => openTheater(item);

        card.onkeydown = (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openTheater(item);
          }
        };

        card.innerHTML = `
          <div class="poster-box">
            <div class="play-overlay"><div class="play-btn-circle">▶</div></div>
            <img src="${item.poster || 'https://images.unsplash.com/photo-1485846234645-a62644f84728?w=400&q=80'}" alt="${item.title}" loading="lazy">
          </div>
          <div class="card-footer">
            <div class="card-title">${item.title}</div>
            <div class="card-tag">${item.year ? item.year + ' • ' : ''}★ ${item.rating || 'N/A'}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function handleSearch() {
      clearTimeout(searchDebounce);
      const query = document.getElementById("searchInput").value.trim();
      searchDebounce = setTimeout(() => fetchMovies(query), 250);
    }

    function openTheater(item) {
      if (!item) return;
      activeItem = item;
      
      const titleEl = document.getElementById("mTitle");
      if (titleEl) titleEl.innerText = item.title || "Playing Video";

      try {
        const newUrl = `${window.location.pathname}?play=${item.id || ''}`;
        window.history.pushState({movieId: item.id}, '', newUrl);
      } catch (e) {
        console.log("History state error:", e);
      }

      const iframe = document.getElementById("embedPlayer");
      const video = document.getElementById("nativePlayer");
      const shield = document.getElementById("clickShield");
      
      if (shield) {
        shield.style.display = "block";
        shield.style.pointerEvents = "auto";
      }
      if (video) {
        video.pause();
        video.classList.add("hidden");
      }
      if (iframe) {
        iframe.src = "about:blank";
        iframe.classList.remove("hidden");
      }

      const streamSource = item.streamUrl || "";

      if (streamSource.includes(".m3u8") || streamSource.endsWith(".mp4")) {
        if (iframe) iframe.classList.add("hidden");
        if (video) video.classList.remove("hidden");
        const proxyStreamUrl = `${API_BASE}/stream/proxy?url=${encodeURIComponent(streamSource)}`;

        if (streamSource.includes(".m3u8") && typeof Hls !== 'undefined' && Hls.isSupported()) {
          if (window.hlsInstance) window.hlsInstance.destroy();
          window.hlsInstance = new Hls();
          window.hlsInstance.loadSource(proxyStreamUrl);
          window.hlsInstance.attachMedia(video);
          window.hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else if (video) {
          video.src = proxyStreamUrl;
          video.play();
        }
      } else {
        const watermark = document.getElementById("hsWatermark");
        if (watermark) watermark.classList.remove("hidden");

        if (streamSource && iframe) {
           iframe.src = streamSource;
        } else if (item.id && iframe) {
           iframe.src = `https://vidstuck.xyz/embed/movie/${item.id}?color=e50914&autoplay=true&back=false`;
        }
      }

      const modal = document.getElementById("playerModal");
      if (modal) {
        modal.classList.remove("hidden");
      }
      setTimeout(() => {
        const closeBtn = document.getElementById("closePlayerBtn");
        if (closeBtn) closeBtn.focus();
      }, 200);
    }

    function closePlayer() {
      window.history.pushState({}, '', window.location.pathname);

      const iframe = document.getElementById("embedPlayer");
      const video = document.getElementById("nativePlayer");
      video.pause();
      video.src = "";
      video.classList.add("hidden");
      if (window.hlsInstance) { window.hlsInstance.destroy(); window.hlsInstance = null; }
      iframe.src = "about:blank";
      iframe.classList.add("hidden");
      document.getElementById("hsWatermark").classList.add("hidden");
      document.getElementById("playerModal").classList.add("hidden");
    }

    function checkUrlParamsAndPlay() {
      const urlParams = new URLSearchParams(window.location.search);
      const playId = urlParams.get('play');
      if (playId) {
        const found = cachedMovies.find(m => String(m.id) === String(playId));
        if (found) {
          openTheater(found);
        } else {
          fetch(`${API_BASE}/movies`).then(res => res.json()).then(movies => {
            const m = movies.find(x => String(x.id) === String(playId));
            if (m) openTheater(m);
          });
        }
      }
    }

    function switchServer(num) {
      document.querySelectorAll(".server-pill").forEach(p => p.classList.remove("active"));
      event.target.classList.add("active");
      if (activeItem) openTheater(activeItem);
    }

    function openAddForm() { document.getElementById("addModal").classList.remove("hidden"); }
    function closeAddForm() { document.getElementById("addModal").classList.add("hidden"); }

    function saveStreamItem() {
      const title = document.getElementById("inTitle")?.value.trim() || "";
      const poster = document.getElementById("inPoster")?.value.trim() || "";
      const tmdbId = document.getElementById("inTmdbId")?.value.trim() || "";
      const streamUrl = document.getElementById("inStreamUrl")?.value.trim() || "";

      if (!title) { alert("Please provide a Title!"); return; }

      const grid = document.getElementById("gridArea");
      const card = document.createElement("div");
      card.className = "card";
      card.setAttribute("tabindex", "0");
      const manualItem = { id: tmdbId || Date.now(), title: title, poster: poster, streamUrl: streamUrl };
      card.onclick = () => openTheater(manualItem);

      card.innerHTML = `
        <div class="poster-box">
          <div class="play-overlay"><div class="play-btn-circle">▶</div></div>
          <img src="${poster || 'https://images.unsplash.com/photo-1485846234645-a62644f84728?w=400&q=80'}" alt="${title}">
        </div>
        <div class="card-footer">
          <div class="card-title">${title}</div>
          <div class="card-tag">Custom • 1080p</div>
        </div>
      `;
      grid.prepend(card);
      closeAddForm();
    }

    window.onload = () => {
      loadSavedVibe();
      checkProAccess();
      fetchMovies();
    };
  </script>
</body>
