<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifying Pass - HubStream</title>
  <style>
    body {
      background-color: #050508;
      color: #f3f4f6;
      font-family: sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .box {
      background: rgba(18, 18, 26, 0.85);
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      padding: 40px;
      border-radius: 20px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h2 style="font-size: 20px; margin-bottom: 10px;">Verifying Your 24H Pass...</h2>
    <p style="font-size: 13px; color: #9ca3af;">Please wait while we unlock HubStream for you.</p>
  </div>

  <script>
    // 24 hours ka expiry time set kar rahe hain
    const expiryTime = new Date().getTime() + (24 * 60 * 60 * 1000);
    localStorage.setItem('hubstream_24h_expiry', expiryTime);

    // 1.5 second baad user ko main unlocked website par bhej do
    setTimeout(() => {
      window.location.href = "/";
    }, 1500);
  </script>
</body>
</html>
